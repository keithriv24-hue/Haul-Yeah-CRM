crons:
  - name: customer-reminders
    description: "Daily 9am ET: customer T-48h move reminders + owner paperwork-gate alerts (72h/48h/24h)"
    cron: "0 9 * * *"
    timezone: "America/New_York"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/customer-reminders"
    method: POST
    enabled: true
  - name: monthly-metrics
    description: "Freeze last month's business metrics snapshot on the 1st (05:10 UTC)"
    cron: "10 5 1 * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/monthly-metrics-snapshot"
    method: POST
    enabled: true
  - name: nightly-open-punch
    description: "11pm ET: flag still-open time punches for owner review + persist end-of-day no-shows (never auto clocks anyone out)"
    cron: "0 23 * * *"
    timezone: "America/New_York"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/nightly-open-punch"
    method: POST
    enabled: true
  - name: nightly-outcome-reconcile
    description: "2am ET: rebuild job outcomes for jobs completed in the last 180 days (catches direct Airtable edits + late-synced punches)"
    cron: "0 2 * * *"
    timezone: "America/New_York"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/nightly-outcome-reconcile"
    method: POST
    enabled: true
